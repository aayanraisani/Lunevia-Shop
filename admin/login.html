<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | Lunévia Admin</title>

    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Store design colors (variables) + admin styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body admin-login-body" data-admin-page="login">

    <main id="adminContent" class="admin-login">

        <div class="admin-login-card">
            <a href="../index.html" class="admin-login-brand">Lunévia</a>
            <p class="admin-login-label">ADMIN PANEL</p>

            <!-- SIGN IN: shown when an admin account already exists -->
            <form id="adminLoginForm" novalidate hidden>

                <div class="form-alert" id="adminLoginMessage" role="alert"></div>

                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary-custom admin-login-btn">Sign in <i class="bi bi-arrow-right"></i></button>

                <p class="admin-login-help">Forgot your password? See the README in the admin folder.</p>

            </form>

            <!-- FIRST-TIME SETUP: shown only when no admin account exists yet -->
            <form id="adminSetupForm" novalidate hidden>

                <h1 class="admin-login-title">Create your admin account</h1>
                <p class="admin-login-intro">You are the first person here, so you choose the admin email and password. Keep them safe.</p>

                <div class="form-alert" id="adminSetupMessage" role="alert"></div>

                <div class="form-group">
                    <label for="setupEmail">Email Address</label>
                    <input type="email" id="setupEmail" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="setupPassword">Password</label>
                    <input type="password" id="setupPassword" autocomplete="new-password" minlength="10" required>
                    <p class="form-help">At least 10 characters.</p>
                </div>

                <div class="form-group">
                    <label for="setupConfirm">Confirm Password</label>
                    <input type="password" id="setupConfirm" autocomplete="new-password" minlength="10" required>
                </div>

                <button type="submit" class="btn btn-primary-custom admin-login-btn">Create admin account <i class="bi bi-arrow-right"></i></button>

            </form>

            <p class="admin-login-note"><a href="../index.html">← Back to the store</a></p>
        </div>

    </main>

    <!-- 1. Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Shared store scripts (keep this order) -->
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/store.js"></script>

    <!-- 3. Admin scripts (keep this order) -->
    <script src="js/admin-data.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/admin-login.js"></script>

</body>
</html>
