<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Add / Edit Product | Lunévia Admin</title>

    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Store design (colors, forms) + order styles + admin styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body admin-checking" data-admin-page="product-edit">

    <!-- The sidebar and top bar are added by js/admin-layout.js -->

    <main id="adminContent" class="admin-content">

        <a href="products.html" class="admin-back"><i class="bi bi-arrow-left"></i> All products</a>

        <div class="admin-page-head">
            <h1 id="productFormTitle">Add a product</h1>
            <p id="productFormIntro">Fill in the details. The product appears in the shop as soon as you save.</p>
        </div>

        <form id="productForm" class="admin-card admin-form-card" novalidate>

            <div class="form-alert" id="productFormMessage" role="alert"></div>

            <div class="form-row">
                <div class="form-group">
                    <label for="pfName">Product Name</label>
                    <input type="text" id="pfName" maxlength="80" required>
                </div>
                <div class="form-group">
                    <label for="pfCategory">Category</label>
                    <select id="pfCategory" required>
                        <option value="">Select category</option>
                        <option value="skincare">Skincare</option><option value="beauty">Beauty</option><option value="jewelry">Jewelry</option><option value="accessories">Accessories</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="pfPrice">Price (USD)</label>
                    <input type="number" id="pfPrice" min="0" step="0.01" inputmode="decimal" required>
                </div>
                <div class="form-group">
                    <label for="pfOldPrice">Old price <span class="optional-label">(optional, for sales)</span></label>
                    <input type="number" id="pfOldPrice" min="0" step="0.01" inputmode="decimal">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="pfStock">Stock</label>
                    <input type="number" id="pfStock" min="0" step="1" inputmode="numeric" required>
                </div>
                <div class="form-group">
                    <label for="pfBadge">Badge</label>
                    <select id="pfBadge">
                        <option value="">No badge</option>
                        <option value="New">New</option>
                        <option value="Sale">Sale</option>
                        <option value="Bestseller">Bestseller</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="pfShort">Short description <span class="optional-label">(optional)</span></label>
                <input type="text" id="pfShort" maxlength="80">
            </div>

            <div class="form-group">
                <label for="pfDescription">Description</label>
                <textarea id="pfDescription" rows="5" required></textarea>
            </div>

            <div class="form-group">
                <label for="pfFile">Photo</label>
                <div class="photo-box">
                    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Photo preview" class="photo-preview" id="pfPreview">
                    <div class="photo-fields">
                        <input type="file" id="pfFile" accept="image/png,image/jpeg,image/webp">
                        <p class="form-help">Upload a photo. It is shrunk and saved in this browser. Or paste a web link below.</p>
                        <input type="text" id="pfImageUrl" placeholder="https://example.com/photo.jpg" aria-label="Photo link">
                    </div>
                </div>
            </div>

            <label class="admin-check">
                <input type="checkbox" id="pfFeatured">
                Show on the homepage under &ldquo;Featured favorites&rdquo;
            </label>

            <div class="admin-form-actions">
                <button type="submit" class="admin-btn admin-btn-primary" id="pfSave">Save product</button>
                <a href="products.html" class="admin-btn admin-btn-ghost">Cancel</a>
                <button type="button" class="admin-btn admin-btn-danger-ghost" id="pfDelete" hidden>Delete product</button>
            </div>

        </form>

    </main>

    <!-- 1. Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Shared store scripts (keep this order) -->
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/store.js"></script>

    <!-- 3. Admin scripts (keep this order) -->
    <script src="js/admin-data.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/admin-product-edit.js"></script>

</body>
</html>
