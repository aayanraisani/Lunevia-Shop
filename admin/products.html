<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Products | Lunévia Admin</title>

    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Store design (colors, forms) + order styles + admin styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body admin-checking" data-admin-page="products">

    <!-- The sidebar and top bar are added by js/admin-layout.js -->

    <main id="adminContent" class="admin-content">

        <div class="admin-page-head admin-page-head-row">
            <div>
                <h1>Products</h1>
                <p>Every product in the shop.</p>
            </div>
            <a href="product-edit.html" class="admin-btn admin-btn-primary"><i class="bi bi-plus-lg"></i> Add product</a>
        </div>

        <div class="admin-card">
            <div class="admin-toolbar">
                <input type="search" id="productSearch" class="admin-input" placeholder="Search products..." aria-label="Search products" autocomplete="off">
                <select id="productCategoryFilter" class="admin-input" aria-label="Filter by category">
                    <option value="">All categories</option>
                    <option value="skincare">Skincare</option><option value="beauty">Beauty</option><option value="jewelry">Jewelry</option><option value="accessories">Accessories</option>
                </select>
                <span class="admin-count" id="productCount" aria-live="polite"></span>
            </div>

            <div class="admin-table-wrap" id="productsTable"></div>

            <div class="admin-form-actions">
                <button type="button" class="admin-btn admin-btn-ghost admin-btn-small" id="restoreSamples">Restore sample products</button>
            </div>
        </div>

    </main>

    <!-- 1. Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Shared store scripts (keep this order) -->
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/store.js"></script>

    <!-- 3. Admin scripts (keep this order) -->
    <script src="js/admin-data.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/admin-products.js"></script>

</body>
</html>
